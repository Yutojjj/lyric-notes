<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111416"><meta name="application-name" content="歌詞文字起こし"><meta name="apple-mobile-web-app-title" content="歌詞文字起こし"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="apple-touch-icon" href="/icon-192.png"><title>歌詞文字起こし</title>
<style>
:root{color-scheme:dark;--bg:#111416;--panel:#1b2023;--line:#343c40;--muted:#a7b3ba;--accent:#d3f796}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef1ee;font-family:"Segoe UI","Yu Gothic UI",sans-serif;font-size:16px}main{max-width:1100px;margin:auto;padding:36px 28px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:24px}.brand{font-weight:750;font-size:21px;letter-spacing:-.5px}.mark{display:inline-grid;place-items:center;background:var(--accent);color:#172116;border-radius:9px;width:32px;height:32px;margin-right:10px}.tag{color:var(--muted);font-size:14px}.intro{padding:58px 0 32px}.eyebrow{color:var(--accent);font-size:14px;letter-spacing:2px}h1{font-size:clamp(30px,5vw,48px);letter-spacing:-1.5px;margin:16px 0}p{color:var(--muted);line-height:1.8}.grid{display:grid;grid-template-columns:1fr 1.1fr;gap:22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px}h2{font-size:20px;margin:0 0 24px}label{display:block;font-size:14px;color:#c8d1d3;margin:20px 0 10px}input,select,textarea{font:inherit;color:#eef1ee;background:#111719;border:1px solid #465155;border-radius:9px;padding:13px;width:100%}input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:2px}select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#b7c3bd 50%),linear-gradient(135deg,#b7c3bd 50%,transparent 50%);background-position:calc(100% - 20px) 52%,calc(100% - 15px) 52%;background-size:5px 5px;background-repeat:no-repeat}button,.download{font:inherit;border:0;border-radius:9px;padding:13px 18px;font-weight:650;cursor:pointer}button:disabled{opacity:.45;cursor:default}.primary{background:var(--accent);color:#192115;width:100%;margin-top:24px}.secondary,.download{background:#313b3f;color:#eef1ee;text-decoration:none}.result-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.result-head h2{margin:0}.result-head button{white-space:nowrap}textarea{height:365px;resize:vertical;margin-top:22px;line-height:1.9}.small{font-size:14px}.status{margin-top:24px;min-height:85px}.status p{margin:0 0 10px}progress{width:100%;accent-color:var(--accent);height:6px}.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.step{padding:7px 10px;border-radius:6px;background:#101719;color:var(--muted);font-size:14px}.step.active{background:#34472b;color:var(--accent)}audio{width:100%;margin:16px 0}details{color:var(--muted);font-size:14px;overflow-wrap:anywhere;margin-top:10px}.foot{margin-top:26px;font-size:14px}#song{overflow-wrap:anywhere;color:#d3f796;margin-top:18px}a{color:var(--accent)}[hidden]{display:none!important}@media(max-width:760px){main{padding:24px 18px}.intro{padding-top:36px}.grid{grid-template-columns:1fr}.card{padding:22px}.tag{font-size:12px}textarea{height:320px}}
.status{min-height:0}#copyStatus:empty{display:none}
.grid{align-items:start;gap:16px}.card{padding:18px;border-radius:14px}h2{font-size:18px;margin-bottom:14px}label{margin:12px 0 8px}.primary{margin-top:14px}textarea{height:240px;margin-top:14px}.status{margin-top:14px}main{padding:24px 20px}@media(max-width:760px){main{padding:16px 12px}.card{padding:16px}textarea{height:220px}}
</style></head>
<body><main>
<div class="grid"><section class="card"><h2>音楽を読み込む</h2>
<form id="form"><label for="url">YouTube / ニコニコ動画のURL</label><input id="url" type="url" placeholder="https://www.youtube.com/watch?v=…" required autocomplete="off">
<button class="primary" id="start">MP3取得・文字起こしを開始</button></form>
<div id="statusBox" class="status" role="status" aria-live="polite" hidden><p id="status" class="small"></p><progress id="progress" max="100" hidden aria-label="処理の進捗"></progress></div>
<details id="errorBox" hidden><summary>エラーの詳細</summary><p id="error"></p></details>
<div id="audioBox" hidden><div id="song"></div><audio id="audio" controls preload="none"></audio><a class="download small" id="download">MP3を保存</a></div>
</section><section class="card"><div class="result-head"><h2>歌詞テキスト</h2><button id="copy" class="secondary" disabled>コピー</button></div><textarea id="lyrics" aria-label="歌詞テキスト" placeholder="歌詞" spellcheck="false"></textarea><p class="small" id="copyStatus" role="status"></p><button id="save" class="secondary small" disabled>TXTを保存</button></section></div>
<button id="install" class="secondary small" hidden>アプリをインストール</button>
</main><script src="/app.js" defer></script></body></html>
